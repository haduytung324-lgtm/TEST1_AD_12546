<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Timestamp Camera + Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #000;
    color: #fff;
    overflow: hidden;
    height: 100dvh;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    background: #111;
  }
  #video {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* mirror front camera by default */
  }
  #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .overlay {
    position: absolute;
    z-index: 10;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #info-overlay {
    bottom: 110px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
  }
  #time-block {
    flex: 1;
  }
  #time {
    font-size: 42px;
    font-weight: 700;
    line-height: 1;
  }
  #date-line {
    font-size: 15px;
    margin-top: 2px;
    opacity: 0.95;
  }
  #address {
    font-size: 13px;
    margin-top: 6px;
    line-height: 1.35;
    max-width: 70%;
  }
  #map-container {
    width: 110px;
    height: 110px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.8);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    pointer-events: auto;
    position: relative;
  }
  #map {
    width: 100%;
    height: 100%;
  }
  #directions-btn {
    position: absolute;
    bottom: 4px;
    right: 4px;
    background: #1a3f95;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    cursor: pointer;
  }
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
    z-index: 20;
  }
  .top-bar button {
    background: none;
    border: none;
    color: #fff;
    font-size: 22px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
  }
  .title {
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .evn-logo {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.35);
    padding: 4px 10px 4px 6px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
  }
  .evn-icon {
    width: 28px;
    height: 28px;
  }
  .evn-text {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #1a3f95 0%, #2563eb 50%, #1e40af 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
  }
  .evn-sub {
    font-size: 9px;
    color: #ffd22c;
    font-weight: 600;
    margin-top: -2px;
    letter-spacing: 0.3px;
  }
  .bottom-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 100px;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding-bottom: 20px;
    z-index: 20;
  }
  .shutter {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #ff3b30;
    border: 4px solid #fff;
    box-shadow: 0 0 0 2px #ff3b30;
    cursor: pointer;
    position: relative;
  }
  .shutter.recording {
    background: #ff3b30;
    border-radius: 12px;
    width: 50px;
    height: 50px;
  }
  .mode-btn {
    background: none;
    border: none;
    color: #fff;
    font-size: 14px;
    opacity: 0.6;
    padding: 8px 12px;
  }
  .mode-btn.active {
    opacity: 1;
    font-weight: 600;
  }
  #preview-btn, #gallery-btn {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    text-align: center;
  }
  #note-display {
    position: absolute;
    top: 80px;
    left: 16px;
    right: 16px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 15px;
    z-index: 15;
    display: none;
    text-shadow: 0 1px 2px #000;
    pointer-events: none;
    max-height: 80px;
    overflow: hidden;
  }
  #note-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #gallery-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.95);
    z-index: 100;
    display: none;
    flex-direction: column;
    padding: 16px;
  }
  #gallery-modal.show { display: flex; }
  #gallery-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 18px;
    font-weight: 600;
  }
  #gallery-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
  }
  #gallery-list {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .gallery-item {
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  .gallery-item img, .gallery-item video {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
  }
  .gallery-actions {
    padding: 8px;
    display: flex;
    gap: 6px;
    justify-content: center;
  }
  .gallery-actions button {
    flex: 1;
    background: #1a3f95;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .gallery-actions button.dir {
    background: #0d6efd;
  }
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="top-bar">
    <button id="flash-btn">⚡</button>
    <div class="title">
      <div class="evn-logo">
        <svg class="evn-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#1a3f95" stroke-width="6"/>
          <polygon points="50,8 58,42 92,50 58,58 50,92 42,58 8,50 42,42" fill="#1a3f95"/>
          <polygon points="50,18 55,45 82,50 55,55 50,82 45,55 18,50 45,45" fill="#c53030"/>
          <polygon points="50,28 53,47 72,50 53,53 50,72 47,53 28,50 47,47" fill="#ffd22c"/>
        </svg>
        <div>
          <div class="evn-text">EVN</div>
        </div>
      </div>
    </div>
    <button id="switch-btn">🔄</button>
    <button id="note-btn">Ghi chú</button>
  </div>

  <div id="status"></div>
  <div id="note-display"></div>

  <div class="overlay" id="info-overlay">
    <div id="time-block">
      <div id="time">--:--</div>
      <div id="date-line">-- Tháng --, ---- · Thứ --, --°C</div>
      <div id="address">Đang lấy vị trí...</div>
    </div>
    <div id="map-container">
      <div id="map"></div>
      <button id="directions-btn" title="Chỉ đường đến vị trí này">🧭</button>
    </div>
  </div>

  <div class="bottom-controls">
    <div id="preview-btn">Xem<br>trước</div>
    <div class="shutter" id="shutter"></div>
    <div id="gallery-btn">Mẫu</div>
  </div>

  <div id="gallery-modal">
    <div id="gallery-header">
      <span>Ảnh / Video đã chụp</span>
      <button id="gallery-close">×</button>
    </div>
    <div id="gallery-list"></div>
  </div>

  <div style="position:absolute; bottom: 20px; left:0; right:0; display:flex; justify-content:center; gap:20px; z-index:25;">
    <button class="mode-btn active" data-mode="photo">Ảnh</button>
    <button class="mode-btn" data-mode="video">Video</button>
  </div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const shutter = document.getElementById('shutter');
const timeEl = document.getElementById('time');
const dateLine = document.getElementById('date-line');
const addressEl = document.getElementById('address');
const statusEl = document.getElementById('status');
const mapContainer = document.getElementById('map');

let stream = null;
let facingMode = 'environment'; // back camera preferred
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];
let currentMode = 'photo';
let map = null;
let marker = null;
let currentLat = null;
let currentLon = null;
let currentTemp = '--';
let gallery = []; // {url, type, lat, lon, address, time}

function saveToGallery(blob, type) {
  const url = URL.createObjectURL(blob);
  const item = {
    url,
    type,
    lat: currentLat,
    lon: currentLon,
    address: currentAddress,
    time: new Date().toLocaleString('vi-VN')
  };
  gallery.unshift(item);
  if (gallery.length > 50) gallery.pop(); // limit
  renderGallery();
  // Still download
  const a = document.createElement('a');
  a.href = url;
  a.download = `${type}_${Date.now()}.${type === 'photo' ? 'png' : 'webm'}`;
  a.click();
}

function renderGallery() {
  const list = document.getElementById('gallery-list');
  list.innerHTML = '';
  if (gallery.length === 0) {
    list.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;opacity:0.6;">Chưa có ảnh nào</div>';
    return;
  }
  gallery.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    const media = item.type === 'photo'
      ? `<img src="${item.url}" alt="photo">`
      : `<video src="${item.url}" muted></video>`;
    div.innerHTML = `
      ${media}
      <div class="gallery-actions">
        <button onclick="openDirections(${item.lat || 0}, ${item.lon || 0})" class="dir">🧭 Chỉ đường</button>
        <button onclick="downloadItem(${idx})">Tải</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function downloadItem(idx) {
  const item = gallery[idx];
  const a = document.createElement('a');
  a.href = item.url;
  a.download = `${item.type}_${idx}.${item.type === 'photo' ? 'png' : 'webm'}`;
  a.click();
}

document.getElementById('preview-btn').addEventListener('click', () => {
  renderGallery();
  document.getElementById('gallery-modal').classList.add('show');
});
document.getElementById('gallery-btn').addEventListener('click', () => {
  renderGallery();
  document.getElementById('gallery-modal').classList.add('show');
});
document.getElementById('gallery-close').addEventListener('click', () => {
  document.getElementById('gallery-modal').classList.remove('show');
});

function openDirections(lat, lon) {
  if (!lat || !lon) {
    statusEl.textContent = 'Chưa có vị trí';
    statusEl.style.display = 'block';
    setTimeout(() => statusEl.style.display = 'none', 1500);
    return;
  }
  // Open Google Maps directions from current location to target
  const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving`;
  window.open(url, '_blank');
}

document.getElementById('directions-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  openDirections(currentLat, currentLon);
});

// Also make map clickable
document.getElementById('map-container').addEventListener('click', () => {
  openDirections(currentLat, currentLon);
});

let currentNote = '';

document.getElementById('note-btn').addEventListener('click', () => {
  const note = prompt('Nhập ghi chú (sẽ hiện lên ảnh/video):', currentNote);
  if (note !== null) {
    currentNote = note.trim();
    const noteDisplay = document.getElementById('note-display');
    if (currentNote) {
      noteDisplay.textContent = '📝 ' + currentNote;
      noteDisplay.style.display = 'block';
    } else {
      noteDisplay.style.display = 'none';
    }
  }
});
const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
const months = ['', 'Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6',
                'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];

function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  timeEl.textContent = `${h}:${m}`;

  const day = days[now.getDay()];
  const d = now.getDate();
  const month = months[now.getMonth() + 1];
  const y = now.getFullYear();
  dateLine.textContent = `${d} ${month}, ${y} · ${day}, ${currentTemp}°C`;
}
setInterval(updateTime, 1000);
updateTime();

async function getLocation() {
  if (!navigator.geolocation) {
    currentAddress = 'Trình duyệt không hỗ trợ vị trí';
    addressEl.textContent = currentAddress;
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos) => {
    currentLat = pos.coords.latitude;
    currentLon = pos.coords.longitude;
    updateMap(currentLat, currentLon);
    await reverseGeocode(currentLat, currentLon);
    await getWeather(currentLat, currentLon);
  }, (err) => {
    currentAddress = 'Không lấy được vị trí';
    addressEl.textContent = currentAddress;
  }, { enableHighAccuracy: true, timeout: 10000 });
}

function updateMap(lat, lon) {
  if (!map) {
    map = L.map('map', {
      zoomControl: false,
      attributionControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false
    }).setView([lat, lon], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);
    marker = L.circleMarker([lat, lon], {
      radius: 6,
      fillColor: '#ff3b30',
      color: '#fff',
      weight: 2,
      fillOpacity: 1
    }).addTo(map);
  } else {
    map.setView([lat, lon], 16);
    marker.setLatLng([lat, lon]);
  }
}

async function reverseGeocode(lat, lon) {
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
      headers: { 'Accept-Language': 'vi' }
    });
    const data = await res.json();
    const addr = data.address || {};
    let parts = [];
    if (addr.road) parts.push(addr.road);
    if (addr.suburb || addr.neighbourhood) parts.push(addr.suburb || addr.neighbourhood);
    if (addr.city || addr.town || addr.county) parts.push(addr.city || addr.town || addr.county);
    if (addr.state) parts.push(addr.state);
    currentAddress = parts.length ? parts.join(', ') : data.display_name.split(',').slice(0, 3).join(', ');
    addressEl.innerHTML = currentAddress + ' 🇻🇳';
  } catch (e) {
    currentAddress = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    addressEl.textContent = currentAddress;
  }
}

async function getWeather(lat, lon) {
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&timezone=auto`);
    const data = await res.json();
    currentTemp = Math.round(data.current.temperature_2m);
    updateTime();
  } catch (e) {
    currentTemp = '--';
  }
}

async function startCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: currentMode === 'video'
    });
    video.srcObject = stream;
    video.play();
    statusEl.style.display = 'none';
  } catch (err) {
    statusEl.textContent = 'Không truy cập được camera. Hãy cho phép quyền camera.';
    statusEl.style.display = 'block';
    console.error(err);
  }
}

function resizeCanvas() {
  canvas.width = video.videoWidth || window.innerWidth;
  canvas.height = video.videoHeight || window.innerHeight;
}

video.addEventListener('loadedmetadata', resizeCanvas);
window.addEventListener('resize', resizeCanvas);

function drawOverlay() {
  if (!video.videoWidth) return;
  resizeCanvas();
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // Draw EVN logo top-left
  ctx.save();
  ctx.font = 'bold 28px -apple-system, sans-serif';
  ctx.fillStyle = '#1a3f95';
  ctx.shadowColor = 'rgba(255,255,255,0.6)';
  ctx.shadowBlur = 2;
  ctx.fillText('EVN', 40, 50);
  ctx.restore();

  // Draw note if exists
  if (currentNote) {
    ctx.save();
    ctx.font = 'bold 20px -apple-system, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;
    // Wrap text
    const maxWidth = canvas.width - 80;
    const words = currentNote.split(' ');
    let line = '';
    let y = 100;
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        ctx.fillText(line, 40, y);
        line = words[n] + ' ';
        y += 26;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, 40, y);
    ctx.restore();
  }

  // Draw text overlays (simplified, bottom-left style)
  ctx.save();
  ctx.font = 'bold 42px -apple-system, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 4;
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  ctx.fillText(timeStr, 30, canvas.height - 160);

  ctx.font = '18px -apple-system, sans-serif';
  const dateStr = `${now.getDate()} ${months[now.getMonth()+1]}, ${now.getFullYear()} · ${days[now.getDay()]}, ${currentTemp}°C`;
  ctx.fillText(dateStr, 30, canvas.height - 125);

  ctx.font = '15px -apple-system, sans-serif';
  const addrLines = currentAddress.split(', ');
  addrLines.forEach((line, i) => {
    ctx.fillText(line + (i === addrLines.length-1 ? ' 🇻🇳' : ''), 30, canvas.height - 95 + i*22);
  });
  ctx.restore();
}

function animate() {
  if (isRecording) {
    drawOverlay();
  }
  requestAnimationFrame(animate);
}
animate();

shutter.addEventListener('click', async () => {
  if (currentMode === 'photo') {
    takePhoto();
  } else {
    if (!isRecording) {
      startRecording();
    } else {
      stopRecording();
    }
  }
});

function takePhoto() {
  if (!video.videoWidth) {
    statusEl.textContent = 'Camera chưa sẵn sàng, thử lại';
    statusEl.style.display = 'block';
    setTimeout(() => statusEl.style.display = 'none', 2000);
    return;
  }
  resizeCanvas();
  drawOverlay();
  canvas.toBlob((blob) => {
    if (!blob) {
      statusEl.textContent = 'Lỗi tạo ảnh';
      statusEl.style.display = 'block';
      return;
    }
    saveToGallery(blob, 'photo');
    statusEl.textContent = 'Đã lưu ảnh';
    statusEl.style.display = 'block';
    setTimeout(() => statusEl.style.display = 'none', 1500);
  }, 'image/png');
}

function startRecording() {
  if (!stream) {
    statusEl.textContent = 'Camera chưa sẵn sàng';
    statusEl.style.display = 'block';
    return;
  }
  recordedChunks = [];
  let canvasStream;
  try {
    canvasStream = canvas.captureStream(30);
  } catch (e) {
    statusEl.textContent = 'Không hỗ trợ quay video trên trình duyệt này';
    statusEl.style.display = 'block';
    return;
  }
  const audioTrack = stream.getAudioTracks()[0];
  if (audioTrack) canvasStream.addTrack(audioTrack);

  let options = {};
  if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
    options.mimeType = 'video/webm;codecs=vp9';
  } else if (MediaRecorder.isTypeSupported('video/webm')) {
    options.mimeType = 'video/webm';
  } else if (MediaRecorder.isTypeSupported('video/mp4')) {
    options.mimeType = 'video/mp4';
  }

  try {
    mediaRecorder = new MediaRecorder(canvasStream, options);
  } catch (e) {
    statusEl.textContent = 'Không thể quay video: ' + e.message;
    statusEl.style.display = 'block';
    return;
  }

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
    saveToGallery(blob, 'video');
    statusEl.textContent = 'Đã lưu video';
    statusEl.style.display = 'block';
    setTimeout(() => statusEl.style.display = 'none', 1500);
  };
  mediaRecorder.start();
  isRecording = true;
  shutter.classList.add('recording');
  statusEl.textContent = 'Đang quay...';
  statusEl.style.display = 'block';
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;
  shutter.classList.remove('recording');
  statusEl.style.display = 'none';
}

document.getElementById('switch-btn').addEventListener('click', () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'none';
  startCamera();
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    if (isRecording) stopRecording();
    startCamera();
  });
});

// Init
getLocation();
startCamera();
setInterval(getLocation, 30000); // update location every 30s
</script>
</body>
